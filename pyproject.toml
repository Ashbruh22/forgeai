[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI: the agent that builds, tests and repairs agents."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.4",
    "pyyaml==6.0.4",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
    "typer==0.29.2",
    "rich==15.0.0",
    "numpy==2.4.6",
    "rank-bm25==0.2.2",
    "sentence-transformers==6.3.0",
    "scikit-learn==1.9.1",
    "pymupdf==2.1",
    "python-docx==1.2.0",
    "pandas==3.1.1",
    "beautifulsoup4==4.15.0",
    "rapidfuzz==3.14.6",
    "word2number==1.1",
    "dateparser==1.5.1",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "reportlab==5.1.1"]

[project.scripts]
forgeai = "forgeai.cli:app"

[tool.setuptools.packages.find]
include = ["forgeai*"]

[tool.setuptools.package-data]
forgeai = ["prompts/**/*.md", "intake/defaults.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not live\""  # plain `pytest` stays offline; run live tests with: pytest -m live
markers = ["live: needs a running Ollama with the configured models (skipped otherwise)"]
