      near-miss p90=0.844); threshold set 0.05 below the in-scope p10 to preserve recall; unanswerable
      near-misses rely on the refusal policy'
    query_rewrite: off by default; the optimizer may enable it for retrieval misses
  fewshot_leakage_check: 'passed: 0 examples checked against 24 eval questions'
