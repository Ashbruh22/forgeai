    generator/refusal_item_live: 1
    generator/refusal_policy: 1
    generator/scope: 1
    generator/snapshot_note: 1
    generator/tool_need: 3
    generator/tool_policy_attached: 1
    generator/tool_policy_missing: 1
    generator/tool_policy_none: 1
    generator/tool_proposal: 3
    runner/agent_turn: 1
    runner/query_rewrite: 1
    runner/system_compile: 1
    runner/tool_protocol: 1
  retrieval_rationale:
    chunking: 'medium sections (avg 146 words): default 350-token chunks'
    hybrid: 'tabular data: codes and names need exact matching, so BM25 weighs as much as dense'
    top_k: 'tabular data: more rows are needed to compare items, so top_k 6'
    min_score: 'calibrated from guard probes: LOW CONFIDENCE: distributions overlap (in-scope p10=0.707,
      near-miss p90=0.805); threshold set 0.05 below the in-scope p10 to preserve recall; unanswerable
      near-misses rely on the refusal policy'
    query_rewrite: off by default; the optimizer may enable it for retrieval misses
  fewshot_leakage_check: 'pending: needs the eval set (P5); see forgeai/generator/fewshot.py'
