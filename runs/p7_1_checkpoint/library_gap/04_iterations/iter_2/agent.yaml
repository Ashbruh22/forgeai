    runner/agent_turn: 1
    runner/query_rewrite: 1
    runner/system_compile: 1
    runner/tool_protocol: 1
  retrieval_rationale:
    chunking: 'short sections (avg 24 words): 200-token chunks'
    hybrid: 'tabular data: codes and names need exact matching, so BM25 weighs as much as dense'
    top_k: 'tabular data: more rows are needed to compare items, so top_k 6'
    min_score: 'calibrated from guard probes: LOW CONFIDENCE: distributions overlap (in-scope p10=0.756,
      near-miss p90=0.807); threshold set 0.05 below the in-scope p10 to preserve recall; unanswerable
      near-misses rely on the refusal policy'
    query_rewrite: off by default; the optimizer may enable it for retrieval misses
  fewshot_leakage_check: 'passed: 0 examples checked against 27 eval questions'
