    min_score: 'calibrated from guard probes: LOW CONFIDENCE: distributions overlap (in-scope p10=0.721,
      near-miss p90=0.781); threshold set 0.05 below the in-scope p10 to preserve recall; unanswerable
      near-misses rely on the refusal policy'
    query_rewrite: off by default; the optimizer may enable it for retrieval misses
