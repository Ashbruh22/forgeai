# ForgeAI configuration. Exact model tags/digests are recorded in every run's manifest.json.
ollama_host: http://localhost:11434
num_ctx: 8192            # fallback; each role below sets its own, sized from the largest measured prompt
ollama_timeout_s: 180    # per call; a timeout is retried once, then that candidate is skipped (logged)
min_free_ram_pct: 15     # a stage warns when free RAM drops below this
# Ollama SERVER settings we rely on (set as user environment variables, then restart Ollama). They are
# verified against the server's own start-up log at the beginning of every stage and recorded in manifest.json.
ollama_env:
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_FLASH_ATTENTION: "1"
  OLLAMA_KV_CACHE_TYPE: q8_0
  OLLAMA_MAX_LOADED_MODELS: "1"
max_output_tokens: 1536   # hard cap per reply; a runaway generation timed out at 600 s once
think: false            # reasoning/thinking mode off for all roles (agent, generator, judge)

agent_model:            # agent + generator model
  name: qwen3:8b
  temperature: 0.1
  seed: 7
  num_ctx: 6144          # largest measured prompt 2,672 tokens + 1,536 output cap = 4,208; 46% headroom

# Judge model is a config value, chosen by MEASURED canary accuracy (spec §6.2),
# not by guesswork. Candidates: gemma3:4b, llama3.1:8b. Must differ in family
# from agent_model (ConfigError otherwise).
judge_model:
  name: llama3.1:8b
  temperature: 0.0
  seed: 7
  num_ctx: 4096          # largest measured judge prompt 699 tokens (+ 1,536 cap); the P6 judge prompt is expected under 2,000

embedding_model: BAAI/bge-small-en-v1.5
embedding_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a   # pinned HF commit
embedding_query_prefix: "Represent this sentence for searching relevant passages: "
cache_dir: .cache

thresholds:
  dev_pass_rate: 0.90
  max_fabricated_on_refusals: 0
  canary_accuracy_min: 0.90
  paraphrase_overlap_max: 0.50
  dedup_similarity: 0.90
  fewshot_leakage_similarity: 0.80
  fact_fuzzy_score: 85

limits:                 # hard limits from the assignment
  max_clarifying_questions: 5
  max_fix_cycles: 3
  min_eval_cases: 20
  max_tool_calls_per_turn: 3
  max_llm_retries: 2
