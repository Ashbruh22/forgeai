# Plan for Demo B. Three supplier terms PDFs; the catalogue CSV is generated by a seeded script.
demo: spares_procurement
company: Calder Bay Ship Management Ltd (a fictional ship-management company)
brief: >-
  Our technical superintendents need help finding ship spares, comparing suppliers, estimating
  order cost with discounts, and knowing when parts will arrive. It should also tell them what's
  in stock right now at each port.
forbidden: []
expected_tools: [csv_lookup, calculator, current_date]
not_expected_tools: [weather]
planted_gaps:
  - id: G-LIVE-STOCK
    description: '"In stock right now at each port". The catalogue stock_port column is a static snapshot, so live stock is a live-data gap.'
suppliers:
  S01: Norvik Marine Supply
  S02: Kestrel Marine Spares
  S03: Aurelian Engineering Parts
documents:
  - file: terms_norvik_marine_supply.pdf
    title: Supplier Terms and Conditions, Norvik Marine Supply (S01)
    effective: 1 January 2026
    sections:
      - title: Scope and Pricing
        brief: Norvik Marine Supply (supplier S01) supplies ship spares to Calder Bay. Prices are the unit prices in the spares catalogue, in US dollars, before discount.
        facts:
          - {id: B-S01-00, statement: Supplier S01 is Norvik Marine Supply, must_contain: ["Norvik Marine Supply", "S01"]}
      - title: Volume Discounts
        brief: Discount tiers apply to the total value of one order before discount. Describe each tier exactly as given.
        facts:
          - {id: B-S01-01, statement: "S01 discount tiers: 5% for orders from USD 5,000 to USD 14,999; 8% from USD 15,000 to USD 49,999; 12% from USD 50,000", must_contain: ["5%", "USD 5,000", "USD 14,999", "8%", "USD 15,000", "USD 49,999", "12%", "USD 50,000"]}
      - title: Delivery and Incoterms
        brief: Delivery terms for parts ordered from Norvik.
        facts:
          - {id: B-S01-02, statement: S01 delivers on Incoterms DAP to the port of call named in the order, must_contain: ["DAP"]}
      - title: Warranty
        brief: Warranty on new parts.
        facts:
          - {id: B-S01-03, statement: S01 warranty is 12 months from delivery, must_contain: ["12 months"]}
      - title: Expedited Orders
        brief: Surcharges for faster delivery than the catalogue lead time.
        facts:
          - {id: B-S01-04, statement: S01 expedite surcharge 15% of order value for delivery within 7 days and 25% within 48 hours, must_contain: ["15%", "7 days", "25%", "48 hours"]}
      - title: Payment and Cancellation
        brief: Payment terms and cancellation of orders.
        facts:
          - {id: B-S01-05, statement: S01 payment terms net 45 days; orders cannot be cancelled after dispatch, must_contain: ["net 45 days"]}
  - file: terms_kestrel_marine_spares.pdf
    title: Supplier Terms and Conditions, Kestrel Marine Spares (S02)
    effective: 1 January 2026
    sections:
      - title: Scope and Pricing
        brief: Kestrel Marine Spares (supplier S02) supplies ship spares to Calder Bay. Prices are the unit prices in the spares catalogue, in US dollars, before discount.
        facts:
          - {id: B-S02-00, statement: Supplier S02 is Kestrel Marine Spares, must_contain: ["Kestrel Marine Spares", "S02"]}
      - title: Volume Discounts
        brief: Discount tiers apply to the total value of one order before discount. Describe each tier exactly as given.
        facts:
          - {id: B-S02-01, statement: "S02 discount tiers: 3% for orders from USD 2,000 to USD 9,999; 6% from USD 10,000 to USD 29,999; 10% from USD 30,000", must_contain: ["3%", "USD 2,000", "USD 9,999", "6%", "USD 10,000", "USD 29,999", "10%", "USD 30,000"]}
      - title: Delivery and Incoterms
        brief: Delivery terms for parts ordered from Kestrel.
        facts:
          - {id: B-S02-02, statement: S02 sells on Incoterms CIF to the destination port, must_contain: ["CIF"]}
      - title: Warranty
        brief: Warranty on new parts.
        facts:
          - {id: B-S02-03, statement: S02 warranty is 18 months from delivery, must_contain: ["18 months"]}
      - title: Expedited Orders
        brief: Surcharges for faster delivery than the catalogue lead time.
        facts:
          - {id: B-S02-04, statement: S02 expedite surcharge 10% of order value for delivery within 10 days and 20% within 72 hours, must_contain: ["10%", "10 days", "20%", "72 hours"]}
      - title: Payment and Cancellation
        brief: Payment terms and cancellation of orders.
        facts:
          - {id: B-S02-05, statement: S02 payment terms net 30 days, must_contain: ["net 30 days"]}
  - file: terms_aurelian_engineering_parts.pdf
    title: Supplier Terms and Conditions, Aurelian Engineering Parts (S03)
    effective: 1 January 2026
    sections:
      - title: Scope and Pricing
        brief: Aurelian Engineering Parts (supplier S03) supplies ship spares to Calder Bay. Prices are the unit prices in the spares catalogue, in US dollars, before discount.
        facts:
          - {id: B-S03-00, statement: Supplier S03 is Aurelian Engineering Parts, must_contain: ["Aurelian Engineering Parts", "S03"]}
      - title: Volume Discounts
        brief: Discount tiers apply to the total value of one order before discount. Describe each tier exactly as given.
        facts:
          - {id: B-S03-01, statement: "S03 discount tiers: 4% for orders from USD 3,000 to USD 11,999; 9% from USD 12,000 to USD 39,999; 15% from USD 40,000", must_contain: ["4%", "USD 3,000", "USD 11,999", "9%", "USD 12,000", "USD 39,999", "15%", "USD 40,000"]}
      - title: Delivery and Incoterms
        brief: Delivery terms for parts ordered from Aurelian.
        facts:
          - {id: B-S03-02, statement: S03 sells on Incoterms EXW from its Singapore warehouse and the buyer arranges freight, must_contain: ["EXW", "Singapore"]}
      - title: Warranty
        brief: Warranty on new and reconditioned parts.
        facts:
          - {id: B-S03-03, statement: S03 warranty is 24 months for new parts and 6 months for reconditioned parts, must_contain: ["24 months", "6 months"]}
      - title: Expedited Orders
        brief: Surcharge for faster delivery than the catalogue lead time.
        facts:
          - {id: B-S03-04, statement: S03 expedite surcharge 18% of order value for any delivery faster than catalogue lead time, must_contain: ["18%"]}
      - title: Payment and Cancellation
        brief: Payment terms and cancellation of orders.
        facts:
          - {id: B-S03-05, statement: S03 payment terms net 60 days, must_contain: ["net 60 days"]}
